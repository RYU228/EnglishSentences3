<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>길잡이영어 7단계 학습법</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] overflow-hidden">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm z-10">
        <div class="flex items-center space-x-2">
            <span class="text-xl">🎧</span>
            <h1 class="font-bold text-base text-slate-800">영어 귀뚫기 7단계</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openSupabaseModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                ⚙️ Supabase 설정
            </button>
            <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                ➕ 문장 추가
            </button>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 flex flex-col p-4 max-w-lg mx-auto w-full overflow-hidden justify-between">
        
        <!-- 상단 정보 및 진행 상황 -->
        <div class="flex items-center justify-between mb-3">
            <div class="text-xs font-medium text-slate-500" id="sentence-counter">문장 1 / 1</div>
            <div class="flex items-center space-x-1">
                <span id="db-status-badge" class="inline-block w-2 h-2 rounded-full bg-amber-400"></span>
                <span class="text-xs text-slate-400" id="db-status-text">로컬 모드</span>
            </div>
        </div>

        <!-- 카드 영역 (단계별 표시) -->
        <div class="flex-1 bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between overflow-y-auto relative">
            
            <!-- 단계 표시 배지 -->
            <div>
                <div class="flex items-center justify-between mb-4">
                    <span id="step-badge" class="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full border border-indigo-100">
                        Step 1
                    </span>
                    <div class="space-x-1">
                        <button onclick="speakCurrentSentence()" class="p-2 rounded-full bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 transition text-slate-600" title="음성 듣기">
                            🔊
                        </button>
                    </div>
                </div>

                <!-- 단계별 안내 제목 -->
                <h2 id="step-title" class="text-sm font-bold text-indigo-900 mb-2">단계 안내</h2>
                <p id="step-desc" class="text-xs text-slate-500 mb-6 leading-relaxed">단계별 설명이 여기에 표시됩니다.</p>
            </div>

            <!-- 핵심 문장 컨텐츠 -->
            <div class="my-auto py-4 border-y border-slate-100">
                <div id="content-display" class="text-lg font-medium text-slate-900 leading-relaxed text-center">
                    문장을 불러오는 중...
                </div>
            </div>

            <!-- 하단부 힌트/해석 -->
            <div class="mt-4 bg-slate-50 p-3 rounded-xl">
                <div class="text-[11px] font-semibold text-slate-400 mb-1">💡 한국어 해석</div>
                <div id="ko-display" class="text-xs text-slate-700 leading-normal">
                    해석 내용
                </div>
            </div>
        </div>

        <!-- 하단 네비게이션 바 (모바일 최적화) -->
        <nav class="mt-4 grid grid-cols-5 gap-2">
            <button onclick="changeStep(-1)" class="bg-white border border-slate-200 hover:bg-slate-50 py-3 rounded-xl font-semibold text-xs text-slate-700 flex flex-col items-center justify-center shadow-sm">
                <span>◀</span>
                <span class="text-[10px] text-slate-400 mt-0.5">이전단계</span>
            </button>
            <button onclick="changeStep(1)" class="col-span-3 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow-md shadow-indigo-100 transition">
                <span id="next-btn-text">다음 단계로 ➔</span>
            </button>
            <button onclick="nextSentence()" class="bg-white border border-slate-200 hover:bg-slate-50 py-3 rounded-xl font-semibold text-xs text-slate-700 flex flex-col items-center justify-center shadow-sm">
                <span>⏭️</span>
                <span class="text-[10px] text-slate-400 mt-0.5">다음문장</span>
            </button>
        </nav>
    </main>

    <!-- Supabase 설정 모달 -->
    <div id="supabase-modal" class="fixed inset-0 bg-black/50 hidden items-end sm:items-center justify-center z-50 p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl animate-in fade-in duration-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-base text-slate-800">Supabase 연결 설정</h3>
                <button onclick="closeSupabaseModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            <p class="text-xs text-slate-500 mb-4">Supabase 프로젝트의 URL과 Anon Key를 입력하여 클라우드 문장 데이터베이스와 연동하세요.</p>
            
            <div class="space-y-3 mb-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Project URL</label>
                    <input type="text" id="sb-url" placeholder="https://xxxx.supabase.co" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Anon Public Key</label>
                    <input type="password" id="sb-key" placeholder="eyJhbGciOi..." class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button onclick="saveSupabaseConfig()" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold text-xs">연동 및 저장</button>
                <button onclick="clearSupabaseConfig()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl font-semibold text-xs">로컬 모드로 전환</button>
            </div>
        </div>
    </div>

    <!-- 문장 추가 모달 -->
    <div id="add-modal" class="fixed inset-0 bg-black/50 hidden items-end sm:items-center justify-center z-50 p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-base text-slate-800">새 학습 문장 추가</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            
            <div class="space-y-3 mb-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">영어 원문 (en)</label>
                    <textarea id="new-en" rows="3" placeholder="Well, to be honest, I usually spend..." class="w-full border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">끊어 읽기 버전 (/ 구분)</label>
                    <textarea id="new-chunked" rows="3" placeholder="Well, to be honest, / I usually spend..." class="w-full border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">한국어 해석 (ko)</label>
                    <input type="text" id="new-ko" placeholder="음, 솔직히 말해서..." class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button onclick="closeAddModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl font-semibold text-xs">취소</button>
                <button onclick="addNewSentence()" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold text-xs">저장하기</button>
            </div>
        </div>
    </div>

    <script>
        // 7단계 정의
        const steps = [
            { step: 1, title: "Step 1: 의미단위 끊어듣기", desc: "원어민의 호흡 단위(/)를 느끼며 의미 단위로 귀를 뚫는 단계입니다." },
            { step: 2, title: "Step 2:  섀도잉 (따라 말하기)", desc: "소리를 듣고 곧바로 따라 하며 입과 혀를 길들입니다." },
            { step: 3, title: "Step 3: 오디오만 듣고 의미 파악", desc: "화면을 보지 않고 귀로만 들으며 내용이 머릿속에 그려지는지 확인합니다." },
            { step: 4, title: "Step 4: 속삭이며 섀도잉 (Soft Shadowing)", desc: "작은 목소리로 리듬감과 연음을 살려 부드럽게 따라 합니다." },
            { step: 5, title: "Step 5: 정크(덩어리) 단위 암기", desc: "단어 단위가 아닌 자주 쓰이는 청크 단위로 구조를 체화합니다." },
            { step: 6, title: "Step 6: 속도 높여 듣기/말하기", desc: "빠른 속도에서도 영어 어순 그대로 인지하는 훈련을 합니다." },
            { step: 7, title: "Step 7: 실전 스피킹 적용", desc: "내 목소리로 완벽하게 녹화/발화하며 완전히 내 것으로 만듭니다." }
        ];

        let currentStepIdx = 0;
        let currentSentenceIdx = 0;
        
        // 기본 샘플 데이터 (IM3 오픽 스크립트)
        let sentences = [
            {
                en: "Well, to be honest, I usually spend my weekends at a local park near my apartment because it’s a great place to unwind after a busy work week.",
                en_chunked: "Well, to be honest, / I usually spend my weekends / at a local park / near my apartment / because it’s a great place / to unwind after a busy work week.",
                ko: "음, 솔직히 말해서, 저는 바쁜 한 주를 보내고 나서 쉬기에 정말 좋은 공간이라 보통 주말에 아파트 근처 동네 공원에서 시간을 보내요."
            }
        ];

        let supabaseClient = null;

        // 초기화
        window.addEventListener('DOMContentLoaded', () => {
            loadSupabaseConfig();
            renderCurrentView();
        });

        // Supabase 설정 관리
        function loadSupabaseConfig() {
            const url = localStorage.getItem('sb_url');
            const key = localStorage.getItem('sb_key');
            if (url && key) {
                document.getElementById('sb-url').value = url;
                document.getElementById('sb-key').value = key;
                initSupabase(url, key);
            }
        }

        function initSupabase(url, key) {
            try {
                supabaseClient = supabase.createClient(url, key);
                document.getElementById('db-status-badge').className = "inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                document.getElementById('db-status-text').innerText = "Supabase 연동됨";
                fetchSupabaseData();
            } catch (e) {
                console.error(e);
                alert("Supabase 연결 실패: URL과 Key를 확인해주세요.");
            }
        }

        async function fetchSupabaseData() {
            if (!supabaseClient) return;
            const { data, error } = await supabaseClient.from('english_sentences').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error(error);
            } else if (data && data.length > 0) {
                sentences = data;
                currentSentenceIdx = 0;
                renderCurrentView();
            }
        }

        function saveSupabaseConfig() {
            const url = document.getElementById('sb-url').value.trim();
            const key = document.getElementById('sb-key').value.trim();
            if (!url || !key) {
                alert("URL과 Key를 모두 입력해주세요.");
                return;
            }
            localStorage.setItem('sb_url', url);
            localStorage.setItem('sb_key', key);
            initSupabase(url, key);
            closeSupabaseModal();
            alert("Supabase 연동이 완료되었습니다!");
        }

        function clearSupabaseConfig() {
            localStorage.removeItem('sb_url');
            localStorage.removeItem('sb_key');
            supabaseClient = null;
            document.getElementById('db-status-badge').className = "inline-block w-2 h-2 rounded-full bg-amber-400";
            document.getElementById('db-status-text').innerText = "로컬 모드";
            closeSupabaseModal();
            alert("로컬 모드로 전환되었습니다.");
        }

        // 화면 렌더링
        function renderCurrentView() {
            if (sentences.length === 0) return;
            const s = sentences[currentSentenceIdx];
            const st = steps[currentStepIdx];

            // 상단 카운터
            document.getElementById('sentence-counter').innerText = `문장 ${currentSentenceIdx + 1} / ${sentences.length}`;

            // 단계 정보
            document.getElementById('step-badge').innerText = `Step ${st.step}`;
            document.getElementById('step-title').innerText = st.title;
            document.getElementById('step-desc').innerText = st.desc;

            // 텍스트 내용 분기 (Step 1일 때는 끊어읽기 버전 표시)
            let displayText = s.en;
            if (currentStepIdx === 0 && s.en_chunked) {
                displayText = s.en_chunked;
            }
            document.getElementById('content-display').innerText = displayText;
            document.getElementById('ko-display').innerText = s.ko;

            // 버튼 텍스트 변경
            document.getElementById('next-btn-text').innerText = currentStepIdx < 6 ? `Step ${st.step + 1}로 ➔` : "완료 (다음 문장)";
        }

        // 단계 변경
        function changeStep(direction) {
            currentStepIdx += direction;
            if (currentStepIdx > 6) {
                currentStepIdx = 0;
                nextSentence();
                return;
            }
            if (currentStepIdx < 0) {
                currentStepIdx = 6;
            }
            renderCurrentView();
        }

        // 다음 문장
        function nextSentence() {
            currentSentenceIdx = (currentSentenceIdx + 1) % sentences.length;
            currentStepIdx = 0;
            renderCurrentView();
        }

        // TTS 음성 재생
        function speakCurrentSentence() {
            if (!('speechSynthesis' in window)) {
                alert("이 브라우저는 음성 재생을 지원하지 않습니다.");
                return;
            }
            window.speechSynthesis.cancel();
            const s = sentences[currentSentenceIdx];
            const textToSpeak = currentStepIdx === 0 && s.en_chunked ? s.en_chunked.replaceAll('/', '') : s.en;
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'en-US';
            utterance.rate = currentStepIdx === 5 ? 1.2 : 0.9; // 6단계에서는 조금 빠르게
            window.speechSynthesis.speak(utterance);
        }

        // 모달 제어
        function openSupabaseModal() { document.getElementById('supabase-modal').classList.remove('hidden'); document.getElementById('supabase-modal').classList.add('flex'); }
        function closeSupabaseModal() { document.getElementById('supabase-modal').classList.remove('flex'); document.getElementById('supabase-modal').classList.add('hidden'); }
        
        function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); document.getElementById('add-modal').classList.add('flex'); }
        function closeAddModal() { document.getElementById('add-modal').classList.remove('flex'); document.getElementById('add-modal').classList.add('hidden'); }

        // 문장 추가
        async function addNewSentence() {
            const en = document.getElementById('new-en').value.trim();
            const en_chunked = document.getElementById('new-chunked').value.trim();
            const ko = document.getElementById('new-ko').value.trim();

            if (!en || !ko) {
                alert("영어 원문과 한국어 해석은 필수 입력입니다.");
                return;
            }

            const newObj = { en, en_chunked: en_chunked || en, ko };

            if (supabaseClient) {
                const { data, error } = await supabaseClient.from('english_sentences').insert([newObj]).select();
                if (error) {
                    alert("Supabase 저장 중 오류 발생: " + error.message);
                    return;
                }
                if (data) sentences.unshift(data[0]);
            } else {
                sentences.unshift(newObj);
            }

            currentSentenceIdx = 0;
            currentStepIdx = 0;
            renderCurrentView();
            closeAddModal();

            // 입력폼 초기화
            document.getElementById('new-en').value = '';
            document.getElementById('new-chunked').value = '';
            document.getElementById('new-ko').value = '';
        }
    </script>
</body>
</html>
