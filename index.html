<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하루 3문장 영어 기록장</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Pretendard', sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f8f9fa; }
    h1 { color: #333; text-align: center; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    input[type="text"] { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .log-item { background: white; padding: 16px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #2563eb; }
    .date { font-size: 0.85em; color: #666; margin-bottom: 8px; }
    ol { margin: 0; padding-left: 20px; }
    li { margin-bottom: 4px; }
  </style>
</head>
<body>

  <h1>📝 하루 3문장 기록장</h1>

  <div class="card">
    <h3>오늘의 3문장 작성</h3>
    <input type="text" id="s1" placeholder="문장 1: 예) I'm stuck in traffic.">
    <input type="text" id="s2" placeholder="문장 2: 예) Practice makes perfect.">
    <input type="text" id="s3" placeholder="문장 3: 예) I will finish this project today.">
    <button onclick="saveSentences()">기록하기</button>
  </div>

  <h2>지난 기록 목록</h2>
  <div id="logs">로딩 중...</div>

  <script>
    // Supabase 설정 정보 입력
    const SUPABASE_URL = 'https://faoplqzjynrabjlmwazp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhb3BscXpqeW5yYWJqbG13YXpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNDUxNjUsImV4cCI6MjEwNzYyMTE2NX0.VvlqDouwOP3ini6LfdFp1fKavWLrGLsWZdFAv1XWLBE';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 저장 함수
  async function saveSentences() {
    const s1 = document.getElementById('s1').value;
    const s2 = document.getElementById('s2').value;
    const s3 = document.getElementById('s3').value;

    if (!s1 || !s2 || !s3) {
      alert('3문장을 모두 입력해주세요!');
      return;
    }

    const { data, error } = await supabaseClient
      .from('sentences')
      .insert([{ sentence1: s1, sentence2: s2, sentence3: s3 }]);

    if (error) {
      alert('저장 실패: ' + error.message);
    } else {
      alert('성공적으로 저장되었습니다!');
      document.getElementById('s1').value = '';
      document.getElementById('s2').value = '';
      document.getElementById('s3').value = '';
      loadSentences();
    }
  }

  // 목록 불러오기 함수
  async function loadSentences() {
    const { data, error } = await supabaseClient
      .from('sentences')
      .select('*')
      .order('created_at', { ascending: false });

    const logsDiv = document.getElementById('logs');
    if (error) {
      logsDiv.innerHTML = '불러오기 실패: ' + error.message;
      return;
    }

    if (!data || data.length === 0) {
      logsDiv.innerHTML = '<p>아직 작성된 기록이 없습니다.</p>';
      return;
    }

    logsDiv.innerHTML = data.map(item => {
      const date = new Date(item.created_at).toLocaleString('ko-KR');
      return `
        <div class="log-item">
          <div class="date">${date}</div>
          <ol>
            <li>${item.sentence1}</li>
            <li>${item.sentence2}</li>
            <li>${item.sentence3}</li>
          </ol>
        </div>
      `;
    }).join('');
  }

  // 페이지 접속 시 목록 자동 로드
  loadSentences();
</script>
</body>
</html>
