<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>영어 귀뚫기 학습 앱</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] overflow-hidden">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm z-10">
        <div class="flex items-center space-x-2">
            <span class="text-xl">🎧</span>
            <h1 class="font-bold text-base text-slate-800">영어 귀뚫기 훈련</h1>
        </div>
        <div class="flex items-center space-x-1 sm:space-x-2">
            <button onclick="openConfigModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                ⚙️ 설정
            </button>
            <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                ➕ 추가
            </button>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 flex flex-col p-4 max-w-lg mx-auto w-full overflow-hidden justify-between">
        
        <!-- 상단 정보 및 진행 상황 -->
        <div class="flex items-center justify-between mb-3">
            <div class="text-xs font-medium text-slate-500" id="sentence-counter">문장 1 / 1</div>
            <div class="flex items-center space-x-2">
                <span id="tts-status-tag" class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">
                    기본 TTS
                </span>
                <div class="flex items-center space-x-1">
                    <span id="db-status-badge" class="inline-block w-2 h-2 rounded-full bg-amber-400"></span>
                    <span class="text-xs text-slate-400" id="db-status-text">로컬 DB</span>
                </div>
            </div>
        </div>

        <!-- 카드 영역 -->
        <div class="flex-1 bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between overflow-y-auto relative">
            
            <!-- 단계 표시 및 옵션 컨트롤 -->
            <div>
                <div class="flex items-center justify-between mb-4">
                    <span id="step-badge" class="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full border border-indigo-100">
                        Step 1
                    </span>
                    
                    <div class="flex items-center space-x-2">
                        <!-- 속도 토글 버튼 (0.75x / 1.0x) -->
                        <button id="speed-btn" onclick="toggleSpeed()" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition flex items-center gap-1">
                            🚀 <span id="speed-text">1.0x</span>
                        </button>

                        <!-- 재생 버튼 -->
                        <button id="tts-play-btn" onclick="speakCurrentSentence()" class="p-2.5 rounded-full bg-indigo-50 hover:bg-indigo-100 text-indigo-600 transition flex items-center justify-center" title="음성 듣기">
                            <span id="tts-btn-icon" class="text-base">🔊</span>
                        </button>
                    </div>
                </div>

                <!-- 단계별 안내 제목 -->
                <h2 id="step-title" class="text-sm font-bold text-indigo-900 mb-1">단계 안내</h2>
                <p id="step-desc" class="text-xs text-slate-500 mb-4 leading-relaxed">단계별 설명이 여기에 표시됩니다.</p>
            </div>

            <!-- 핵심 문장 컨텐츠 -->
            <div class="my-auto py-4 border-y border-slate-100">
                <div id="content-display" class="text-lg font-medium text-slate-900 leading-relaxed text-center">
                    문장을 불러오는 중...
                </div>
            </div>

            <!-- 하단부 힌트/해석 -->
            <div class="mt-4 bg-slate-50 p-3 rounded-xl">
                <div class="text-[11px] font-semibold text-slate-400 mb-1">💡 한국어 해석</div>
                <div id="ko-display" class="text-xs text-slate-700 leading-normal">
                    해석 내용
                </div>
            </div>
        </div>

        <!-- 하단 네비게이션 바 -->
        <nav class="mt-4 grid grid-cols-5 gap-2">
            <button onclick="changeStep(-1)" class="bg-white border border-slate-200 hover:bg-slate-50 py-3 rounded-xl font-semibold text-xs text-slate-700 flex flex-col items-center justify-center shadow-sm">
                <span>◀</span>
                <span class="text-[10px] text-slate-400 mt-0.5">이전단계</span>
            </button>
            <button onclick="changeStep(1)" class="col-span-3 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow-md shadow-indigo-100 transition">
                <span id="next-btn-text">다음 단계로 ➔</span>
            </button>
            <button onclick="nextSentence()" class="bg-white border border-slate-200 hover:bg-slate-50 py-3 rounded-xl font-semibold text-xs text-slate-700 flex flex-col items-center justify-center shadow-sm">
                <span>⏭️</span>
                <span class="text-[10px] text-slate-400 mt-0.5">다음문장</span>
            </button>
        </nav>
    </main>

    <!-- 설정 모달 -->
    <div id="config-modal" class="fixed inset-0 bg-black/50 hidden items-end sm:items-center justify-center z-50 p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="font-bold text-base text-slate-800">앱 서비스 연동 설정</h3>
                <button onclick="closeConfigModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>

            <div class="mb-6">
                <h4 class="font-semibold text-xs text-indigo-700 mb-2 flex items-center gap-1">
                    🗣️ Google Cloud TTS 설정
                </h4>
                <div class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Google Cloud API Key</label>
                        <input type="password" id="g-api-key" placeholder="AIzaSy..." class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">음성 모델 선택</label>
                        <select id="g-voice-name" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 bg-white">
                            <option value="en-US-Neural2-F">en-US-Neural2-F (여성 고품질)</option>
                            <option value="en-US-Neural2-D">en-US-Neural2-D (남성 고품질)</option>
                            <option value="en-US-Journey-F">en-US-Journey-F (대화체 여성)</option>
                            <option value="en-US-Journey-D">en-US-Journey-D (대화체 남성)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="mb-6 border-t pt-4">
                <h4 class="font-semibold text-xs text-emerald-700 mb-2 flex items-center gap-1">
                    🗄️ Supabase DB 설정
                </h4>
                <div class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Project URL</label>
                        <input type="text" id="sb-url" placeholder="https://xxxx.supabase.co" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Anon Public Key</label>
                        <input type="password" id="sb-key" placeholder="eyJhbGciOi..." class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-2 pt-2 border-t">
                <button onclick="saveAllConfigs()" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold text-xs">설정 저장 및 적용</button>
            </div>
        </div>
    </div>

    <!-- 문장 추가 모달 -->
    <div id="add-modal" class="fixed inset-0 bg-black/50 hidden items-end sm:items-center justify-center z-50 p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-base text-slate-800">새 학습 문장 추가</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            
            <div class="space-y-3 mb-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">영어 원문 (en)</label>
                    <textarea id="new-en" rows="3" placeholder="Well, to be honest, I usually spend..." class="w-full border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">끊어 읽기 버전 (/ 구분)</label>
                    <textarea id="new-chunked" rows="3" placeholder="Well, to be honest, / I usually spend..." class="w-full border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">한국어 해석 (ko)</label>
                    <input type="text" id="new-ko" placeholder="음, 솔직히 말해서..." class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button onclick="closeAddModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl font-semibold text-xs">취소</button>
                <button onclick="addNewSentence()" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold text-xs">저장하기</button>
            </div>
        </div>
    </div>

    <script>
        // 개편된 3단계 로직 정의
        const steps = [
            { step: 1, title: "Step 1: 전체 문장 연속 듣기", desc: "원문 전체를 부드럽게 들으며 맥락을 파악하는 단계입니다." },
            { step: 2, title: "Step 2: 의미 단위 끊어 읽기", desc: "청크 단위(/)로 0.5초간 쉬어가며 어순과 억양을 체화합니다." },
            { step: 3, title: "Step 3: 섀도잉 및 무한 반복", desc: "음성이 자동 반복 재생됩니다. 소리를 듣자마자 입으로 따라 말해보세요." }
        ];

        let currentStepIdx = 0;
        let currentSentenceIdx = 0;
        let currentAudioObject = null;
        let selectedSpeed = 1.0; // 기본 배속 (1.0 or 0.75)
        
        let sentences = [
            {
                en: "Well, to be honest, I usually spend my weekends at a local park near my apartment because it’s a great place to unwind after a busy work week.",
                en_chunked: "Well, to be honest, / I usually spend my weekends / at a local park / near my apartment / because it’s a great place / to unwind after a busy work week.",
                ko: "음, 솔직히 말해서, 저는 바쁜 한 주를 보내고 나서 쉬기에 정말 좋은 공간이라 보통 주말에 아파트 근처 동네 공원에서 시간을 보내요."
            }
        ];

        let supabaseClient = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadAllConfigs();
            renderCurrentView();
        });

        function loadAllConfigs() {
            const gKey = localStorage.getItem('g_api_key');
            const gVoice = localStorage.getItem('g_voice_name') || 'en-US-Neural2-F';
            if (gKey) {
                document.getElementById('g-api-key').value = gKey;
                document.getElementById('g-voice-name').value = gVoice;
                document.getElementById('tts-status-tag').className = "text-[10px] font-medium px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700";
                document.getElementById('tts-status-tag').innerText = "Google TTS";
            }

            const url = localStorage.getItem('sb_url');
            const key = localStorage.getItem('sb_key');
            if (url && key) {
                document.getElementById('sb-url').value = url;
                document.getElementById('sb-key').value = key;
                initSupabase(url, key);
            }
        }

        function saveAllConfigs() {
            const gKey = document.getElementById('g-api-key').value.trim();
            const gVoice = document.getElementById('g-voice-name').value;
            if (gKey) {
                localStorage.setItem('g_api_key', gKey);
                localStorage.setItem('g_voice_name', gVoice);
                document.getElementById('tts-status-tag').className = "text-[10px] font-medium px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700";
                document.getElementById('tts-status-tag').innerText = "Google TTS";
            } else {
                localStorage.removeItem('g_api_key');
                localStorage.removeItem('g_voice_name');
                document.getElementById('tts-status-tag').className = "text-[10px] font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-500";
                document.getElementById('tts-status-tag').innerText = "기본 TTS";
            }

            const url = document.getElementById('sb-url').value.trim();
            const key = document.getElementById('sb-key').value.trim();
            if (url && key) {
                localStorage.setItem('sb_url', url);
                localStorage.setItem('sb_key', key);
                initSupabase(url, key);
            } else {
                localStorage.removeItem('sb_url');
                localStorage.removeItem('sb_key');
                supabaseClient = null;
                document.getElementById('db-status-badge').className = "inline-block w-2 h-2 rounded-full bg-amber-400";
                document.getElementById('db-status-text').innerText = "로컬 DB";
            }

            closeConfigModal();
            alert("설정이 저장되었습니다.");
        }

        function initSupabase(url, key) {
            try {
                supabaseClient = supabase.createClient(url, key);
                document.getElementById('db-status-badge').className = "inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                document.getElementById('db-status-text').innerText = "Supabase 연동";
                fetchSupabaseData();
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchSupabaseData() {
            if (!supabaseClient) return;
            const { data, error } = await supabaseClient.from('english_sentences').select('*').order('created_at', { ascending: false });
            if (!error && data && data.length > 0) {
                sentences = data;
                currentSentenceIdx = 0;
                renderCurrentView();
            }
        }

        // 속도 토글 기능 (1.0x <-> 0.75x)
        function toggleSpeed() {
            selectedSpeed = selectedSpeed === 1.0 ? 0.75 : 1.0;
            document.getElementById('speed-text').innerText = `${selectedSpeed}x`;
            if (currentAudioObject) {
                currentAudioObject.playbackRate = selectedSpeed;
            }
        }

        // 핵심: 음성 재생 함수 (SSML 끊어 읽기 + 속도 적용)
        async function speakCurrentSentence() {
            const s = sentences[currentSentenceIdx];
            if (!s) return;

            const apiKey = localStorage.getItem('g_api_key');
            const voiceName = localStorage.getItem('g_voice_name') || 'en-US-Neural2-F';

            // 이전 오디오 재생 정지
            if (currentAudioObject) {
                currentAudioObject.pause();
                currentAudioObject = null;
            }

            const btnIcon = document.getElementById('tts-btn-icon');
            btnIcon.innerText = "⏳";

            // Step 2 (끊어 읽기) 단계일 때만 / 기호를 SSML break로 변환
            const isChunkMode = currentStepIdx === 1;

            if (apiKey) {
                const url = `https://texttospeech.googleapis.com/v1/text:synthesize?key=${apiKey}`;
                
                let requestInput = {};

                if (isChunkMode && s.en_chunked) {
                    // / 기호를 SSML 500ms 쉼 태그로 전환
                    const cleanChunked = s.en_chunked.replaceAll('/', '<break time="500ms"/>');
                    const ssmlText = `<speak>${cleanChunked}</speak>`;
                    requestInput = { ssml: ssmlText };
                } else {
                    const rawText = s.en_chunked ? s.en_chunked.replaceAll('/', '') : s.en;
                    requestInput = { text: rawText };
                }

                const requestBody = {
                    input: requestInput,
                    voice: {
                        languageCode: 'en-US',
                        name: voiceName
                    },
                    audioConfig: {
                        audioEncoding: 'MP3',
                        speakingRate: selectedSpeed
                    }
                };

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });

                    const data = await response.json();

                    if (data.audioContent) {
                        const audio = new Audio("data:audio/mp3;base64," + data.audioContent);
                        audio.playbackRate = selectedSpeed;
                        currentAudioObject = audio;

                        // Step 3 (섀도잉) 단계일 경우 무한 자동 반복 재생
                        if (currentStepIdx === 2) {
                            audio.loop = true;
                        }

                        audio.play();
                        audio.onended = () => { if (!audio.loop) btnIcon.innerText = "🔊"; };
                        btnIcon.innerText = "🔊";
                    } else if (data.error) {
                        alert("Google TTS 오류: " + data.error.message);
                        btnIcon.innerText = "🔊";
                    }
                } catch (error) {
                    console.error("GCP TTS Fetch Error:", error);
                    alert("Google Cloud API 연동 실패.");
                    btnIcon.innerText = "🔊";
                }
            } else {
                // 웹 브라우저 기본 Web Speech API (API Key 없을 때 폴백)
                if (!('speechSynthesis' in window)) {
                    alert("이 브라우저는 음성 재생을 지원하지 않습니다.");
                    btnIcon.innerText = "🔊";
                    return;
                }
                window.speechSynthesis.cancel();
                let textToSpeak = isChunkMode && s.en_chunked ? s.en_chunked.replaceAll('/', ', ') : s.en;
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'en-US';
                utterance.rate = selectedSpeed;
                utterance.onend = () => { btnIcon.innerText = "🔊"; };
                window.speechSynthesis.speak(utterance);
                btnIcon.innerText = "🔊";
            }
        }

        // 화면 렌더링
        function renderCurrentView() {
            if (sentences.length === 0) return;

            // 단계 변경 시 기존 재생 중인 음성 정지
            if (currentAudioObject) {
                currentAudioObject.pause();
                currentAudioObject = null;
                document.getElementById('tts-btn-icon').innerText = "🔊";
            }

            const s = sentences[currentSentenceIdx];
            const st = steps[currentStepIdx];

            document.getElementById('sentence-counter').innerText = `문장 ${currentSentenceIdx + 1} / ${sentences.length}`;
            document.getElementById('step-badge').innerText = `Step ${st.step}`;
            document.getElementById('step-title').innerText = st.title;
            document.getElementById('step-desc').innerText = st.desc;

            // 텍스트 내용 분기 (Step 2일 때만 끊어 읽기 표기 표시)
            let displayText = s.en;
            if (currentStepIdx === 1 && s.en_chunked) {
                displayText = s.en_chunked;
            }
            document.getElementById('content-display').innerText = displayText;
            document.getElementById('ko-display').innerText = s.ko;
            document.getElementById('next-btn-text').innerText = currentStepIdx < 2 ? `Step ${st.step + 1}로 ➔` : "완료 (다음 문장)";
        }

        function changeStep(direction) {
            currentStepIdx += direction;
            if (currentStepIdx > 2) {
                currentStepIdx = 0;
                nextSentence();
                return;
            }
            if (currentStepIdx < 0) currentStepIdx = 2;
            renderCurrentView();
        }

        function nextSentence() {
            currentSentenceIdx = (currentSentenceIdx + 1) % sentences.length;
            currentStepIdx = 0;
            renderCurrentView();
        }

        function openConfigModal() { document.getElementById('config-modal').classList.remove('hidden'); document.getElementById('config-modal').classList.add('flex'); }
        function closeConfigModal() { document.getElementById('config-modal').classList.remove('flex'); document.getElementById('config-modal').classList.add('hidden'); }
        
        function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); document.getElementById('add-modal').classList.add('flex'); }
        function closeAddModal() { document.getElementById('add-modal').classList.remove('flex'); document.getElementById('add-modal').classList.add('hidden'); }

        async function addNewSentence() {
            const en = document.getElementById('new-en').value.trim();
            const en_chunked = document.getElementById('new-chunked').value.trim();
            const ko = document.getElementById('new-ko').value.trim();

            if (!en || !ko) {
                alert("영어 원문과 한국어 해석은 필수 입력입니다.");
                return;
            }

            const newObj = { en, en_chunked: en_chunked || en, ko };

            if (supabaseClient) {
                const { data, error } = await supabaseClient.from('english_sentences').insert([newObj]).select();
                if (!error && data) {
                    sentences.unshift(data[0]);
                }
            } else {
                sentences.unshift(newObj);
            }

            currentSentenceIdx = 0;
            currentStepIdx = 0;
            renderCurrentView();
            closeAddModal();

            document.getElementById('new-en').value = '';
            document.getElementById('new-chunked').value = '';
            document.getElementById('new-ko').value = '';
        }
    </script>
</body>
</html>
