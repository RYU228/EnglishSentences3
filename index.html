<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>영어 귀뚫기 학습 앱</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] overflow-hidden">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm z-10 shrink-0">
        <div class="flex items-center space-x-2">
            <span class="text-xl">🎧</span>
            <h1 class="font-bold text-base text-slate-800 truncate max-w-[140px] sm:max-w-[200px]" id="current-topic-title">영어 귀뚫기 훈련</h1>
        </div>
        <div class="flex items-center space-x-1 sm:space-x-2">
            <button onclick="openTopicModal()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                📚 주제선택
            </button>
            <button onclick="openStatsModal()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                📊 통계
            </button>
            <button onclick="openConfigModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                ⚙️ 설정
            </button>
            <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                ➕ 추가
            </button>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 flex flex-col p-4 max-w-lg mx-auto w-full overflow-hidden justify-between">
        
        <!-- 상단 정보 및 진행 상황 -->
        <div class="flex items-center justify-between mb-2 shrink-0">
            <div class="text-xs font-medium text-slate-500" id="sentence-counter">문장 1 / 1</div>
            <div class="flex items-center space-x-2">
                <span id="tts-status-tag" class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">
                    기본 TTS
                </span>
                <div class="flex items-center space-x-1">
                    <span id="db-status-badge" class="inline-block w-2 h-2 rounded-full bg-amber-400"></span>
                    <span class="text-xs text-slate-400" id="db-status-text">로컬 DB</span>
                </div>
            </div>
        </div>

        <!-- 카드 영역 -->
        <div class="flex-1 bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between overflow-y-auto relative mb-2">
            
            <!-- 단계 표시 및 배속/영작 버튼 -->
            <div class="shrink-0">
                <div class="flex items-center justify-between mb-3">
                    <span id="step-badge" class="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full border border-indigo-100">
                        Step 1
                    </span>
                    
                    <div class="flex items-center space-x-1.5">
                        <button onclick="toggleWritingMode()" id="writing-mode-btn" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition">
                            ✏️ 영작: <span id="writing-status" class="text-slate-500">OFF</span>
                        </button>
                        <button id="speed-btn" onclick="toggleSpeed()" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition flex items-center gap-1">
                            🚀 <span id="speed-text">1.0x</span>
                        </button>
                        <button id="tts-play-btn" onclick="speakCurrentContent()" class="p-2.5 rounded-full bg-indigo-50 hover:bg-indigo-100 text-indigo-600 transition flex items-center justify-center" title="음성 듣기">
                            <span id="tts-btn-icon" class="text-base">🔊</span>
                        </button>
                    </div>
                </div>

                <h2 id="step-title" class="text-xs font-bold text-indigo-900 mb-1">단계 안내</h2>
                <p id="step-desc" class="text-[11px] text-slate-500 mb-3 leading-relaxed">단계별 설명이 여기에 표시됩니다.</p>
            </div>

            <!-- 핵심 문장 컨텐츠 (운전 중 가독성 최우선 대형 폰트) -->
            <div class="my-auto py-3 border-y border-slate-100 flex flex-col items-center justify-center">
                <div id="content-display" class="text-2xl sm:text-3xl font-bold text-slate-900 leading-snug text-center tracking-tight">
                    로딩 중...
                </div>
                <div id="writing-display" class="hidden text-center w-full">
                    <div class="text-[11px] font-semibold text-indigo-600 mb-1">🧠 한글 보고 영작하기</div>
                    <div id="writing-ko-prompt" class="text-xl sm:text-2xl font-bold text-slate-800 mb-3">한국어 해석</div>
                    <button onclick="revealWritingAnswer()" id="reveal-btn" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl text-xs font-bold transition">
                        👁️ 정답(영어 원문) 보기
                    </button>
                    <div id="writing-answer-box" class="hidden mt-3 p-3 bg-slate-50 rounded-xl text-lg font-semibold text-slate-900">
                        영어 원문
                    </div>
                </div>
            </div>

            <!-- 하단부 추가 기능 영역 -->
            <div class="space-y-2 mt-2 shrink-0">
                <div id="expressions-container" class="hidden flex flex-wrap gap-1.5 items-center">
                    <span class="text-[10px] font-bold text-slate-400 mr-0.5">🔑 핵심표현:</span>
                    <div id="expression-chips" class="flex flex-wrap gap-1.5"></div>
                </div>

                <div id="patterns-container" class="hidden bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                    <div class="text-[10px] font-bold text-indigo-600 mb-1">🔄 변형 패턴 연습 (터치 시 재생)</div>
                    <div id="pattern-list" class="space-y-1"></div>
                </div>

                <div id="ko-box" class="bg-slate-50 p-2.5 rounded-xl">
                    <div class="text-[10px] font-semibold text-slate-400 mb-0.5">💡 한국어 해석</div>
                    <div id="ko-display" class="text-xs text-slate-700 leading-normal">
                        해석 내용
                    </div>
                </div>
            </div>
        </div>

        <!-- 하단 네비게이션 바 -->
        <nav class="grid grid-cols-5 gap-2 shrink-0">
            <button onclick="changeStep(-1)" class="bg-white border border-slate-200 hover:bg-slate-50 py-3 rounded-xl font-semibold text-xs text-slate-700 flex flex-col items-center justify-center shadow-sm">
                <span>◀</span>
                <span class="text-[10px] text-slate-400 mt-0.5">이전단계</span>
            </button>
            <button onclick="changeStep(1)" class="col-span-3 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-1 shadow-md shadow-indigo-100 transition">
                <span id="next-btn-text">다음 단계로 ➔</span>
            </button>
            <button onclick="nextTopic()" class="bg-white border border-slate-200 hover:bg-slate-50 py-3 rounded-xl font-semibold text-xs text-slate-700 flex flex-col items-center justify-center shadow-sm">
                <span>⏭️</span>
                <span class="text-[10px] text-slate-400 mt-0.5">다음주제</span>
            </button>
        </nav>
    </main>

    <!-- 주제 선택 모달 -->
    <div id="topic-modal" class="fixed inset-0 bg-black/50 hidden items-end sm:items-center justify-center z-50 p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b pb-3 shrink-0">
                <h3 class="font-bold text-base text-slate-800">📚 학습할 주제(문제) 선택</h3>
                <button onclick="closeTopicModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            <div id="topic-list-container" class="flex-1 overflow-y-auto space-y-2 mb-4"></div>
            <button onclick="closeTopicModal()" class="w-full bg-slate-100 text-slate-700 py-2.5 rounded-xl font-semibold text-xs shrink-0">닫기</button>
        </div>
    </div>

    <!-- 통계 모달 -->
    <div id="stats-modal" class="fixed inset-0 bg-black/50 hidden items-end sm:items-center justify-center z-50 p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b pb-3 shrink-0">
                <h3 class="font-bold text-base text-slate-800">📊 주제별 학습 통계</h3>
                <button onclick="closeStatsModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            <div id="stats-list-container" class="flex-1 overflow-y-auto space-y-2 mb-4"></div>
            <button onclick="closeStatsModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold text-xs shrink-0">확인</button>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div id="config-modal" class="fixed inset-0 bg-black/50 hidden items-end sm:items-center justify-center z-50 p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="font-bold text-base text-slate-800">앱 서비스 연동 설정</h3>
                <button onclick="closeConfigModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            <div class="mb-4">
                <h4 class="font-semibold text-xs text-indigo-700 mb-2">🗣️ Google Cloud TTS 설정</h4>
                <div class="space-y-2">
                    <input type="password" id="g-api-key" placeholder="Google Cloud API Key" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs">
                    <select id="g-voice-name" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs bg-white">
                        <option value="en-US-Neural2-F">en-US-Neural2-F (여성 고품질)</option>
                        <option value="en-US-Neural2-D">en-US-Neural2-D (남성 고품질)</option>
                        <option value="en-US-Journey-F">en-US-Journey-F (대화체 여성)</option>
                        <option value="en-US-Journey-D">en-US-Journey-D (대화체 남성)</option>
                    </select>
                </div>
            </div>
            <div class="mb-4 border-t pt-3">
                <h4 class="font-semibold text-xs text-emerald-700 mb-2">🗄️ Supabase DB 설정</h4>
                <div class="space-y-2">
                    <input type="text" id="sb-url" placeholder="Project URL" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs">
                    <input type="password" id="sb-key" placeholder="Anon Public Key" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs">
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="clearAllConfigs()" class="w-1/2 bg-rose-100 hover:bg-rose-200 text-rose-700 py-2.5 rounded-xl font-semibold text-xs">설정 초기화</button>
                <button onclick="saveAllConfigs()" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold text-xs">저장 및 적용</button>
            </div>
        </div>
    </div>

    <!-- 주제 및 문장 추가 모달 (메인-서브 구조 동시 등록) -->
    <div id="add-modal" class="fixed inset-0 bg-black/50 hidden items-end sm:items-center justify-center z-50 p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-3 border-b pb-3 shrink-0">
                <h3 class="font-bold text-base text-slate-800">새 주제 & 문장 세트 등록</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            
            <div class="flex-1 overflow-y-auto space-y-3 mb-4 pr-1">
                <!-- 메인 주제 입력 -->
                <div class="bg-indigo-50/70 p-3 rounded-xl border border-indigo-100 space-y-2">
                    <div class="text-xs font-bold text-indigo-800">📌 1. 메인 주제 (Topic)</div>
                    <input type="text" id="new-topic-title" placeholder="주제 제목 (예: 주말 동네 공원 산책 루틴)" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs">
                    <input type="text" id="new-topic-desc" placeholder="간단한 설명 (선택 사항)" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs">
                </div>

                <!-- 서브 문장 입력 리스트 -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-slate-700">📝 2. 세부 문장 목록 (순서대로)</span>
                        <button type="button" onclick="appendSentenceInputRow()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-lg text-[11px] font-bold">
                            + 문장 칸 추가
                        </button>
                    </div>
                    <div id="sentence-inputs-container" class="space-y-2.5">
                        <!-- 자바스크립트로 기본 입력칸 생성 -->
                    </div>
                </div>
            </div>

            <button onclick="saveNewTopicAndSentences()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-xs shrink-0">주제 및 문장 전체 저장</button>
        </div>
    </div>

    <script>
        const steps = [
            { step: 1, title: "Step 1: 전체 스크립트 귀로 듣기", desc: "화면을 보지 않고 주제 전체 문장을 연속해서 귀로만 듣습니다." },
            { step: 2, title: "Step 2: 문장 단위 순차 학습", desc: "'다음 단계'를 누르면 주제 내 문장이 1번부터 차례대로 큼직하게 넘어갑니다." },
            { step: 3, title: "Step 3: 전체 스크립트 무한 섀도잉", desc: "전체 스크립트가 자동 반복됩니다. 원어민 호흡을 따라 말해보세요." }
        ];

        let currentStepIdx = 0;       // 0: Step1, 1: Step2, 2: Step3
        let currentTopicIdx = 0;      // 현재 선택된 메인 주제 인덱스
        let currentSubSentenceIdx = 0; // Step 2에서 현재 보고 있는 서브 문장 인덱스
        let currentAudioObject = null;
        let selectedSpeed = 1.0;
        let isWritingMode = false;

        // 메인-서브 계층형 기본 데이터 (DB 연동 전이나 오프라인 시 동작)
        let topicsData = [
            {
                id: "default-topic-1",
                title: "주말 동네 공원 산책 루틴",
                description: "오픽 대화형 필수 스크립트 주제",
                sentences: [
                    {
                        id: "s-1",
                        sentence_order: 1,
                        en: "Well, to be honest, I usually spend my weekends at a local park near my apartment.",
                        ko: "음, 솔직히 말해서, 저는 보통 주말을 아파트 근처 동네 공원에서 보냅니다.",
                        expressions: ["to be honest", "local park"],
                        patterns: ["I usually spend my weekends at a local park.", "I usually spend my evenings at home."]
                    },
                    {
                        id: "s-2",
                        sentence_order: 2,
                        en: "It’s a great place to unwind after a busy work week.",
                        ko: "바쁜 한 주를 보낸 후에 긴장을 풀기에 아주 좋은 장소거든요.",
                        expressions: ["unwind", "after a busy work week"],
                        patterns: ["It's a great place to relax after work."]
                    }
                ]
            }
        ];

        let supabaseClient = null;

        window.addEventListener('DOMContentLoaded', () => {
            try {
                resetAddModalInputs();
                loadAllConfigs();
                renderCurrentView();
            } catch (e) {
                console.error("Init Error:", e);
                renderCurrentView();
            }
        });

        function loadAllConfigs() {
            try {
                const gKey = localStorage.getItem('g_api_key');
                const gVoice = localStorage.getItem('g_voice_name') || 'en-US-Neural2-F';
                if (gKey && document.getElementById('g-api-key')) {
                    document.getElementById('g-api-key').value = gKey;
                    document.getElementById('g-voice-name').value = gVoice;
                    document.getElementById('tts-status-tag').className = "text-[10px] font-medium px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700";
                    document.getElementById('tts-status-tag').innerText = "Google TTS";
                }

                const url = localStorage.getItem('sb_url');
                const key = localStorage.getItem('sb_key');
                if (url && key) {
                    if (document.getElementById('sb-url')) document.getElementById('sb-url').value = url;
                    if (document.getElementById('sb-key')) document.getElementById('sb-key').value = key;
                    initSupabase(url, key);
                }
            } catch (err) {}
        }

        function saveAllConfigs() {
            try {
                const gKey = document.getElementById('g-api-key').value.trim();
                const gVoice = document.getElementById('g-voice-name').value;
                if (gKey) {
                    localStorage.setItem('g_api_key', gKey);
                    localStorage.setItem('g_voice_name', gVoice);
                } else {
                    localStorage.removeItem('g_api_key');
                    localStorage.removeItem('g_voice_name');
                }

                const url = document.getElementById('sb-url').value.trim();
                const key = document.getElementById('sb-key').value.trim();
                if (url && key) {
                    localStorage.setItem('sb_url', url);
                    localStorage.setItem('sb_key', key);
                    initSupabase(url, key);
                } else {
                    localStorage.removeItem('sb_url');
                    localStorage.removeItem('sb_key');
                    supabaseClient = null;
                }
                closeConfigModal();
                alert("설정이 저장되었습니다.");
                location.reload();
            } catch (e) {}
        }

        function clearAllConfigs() {
            localStorage.clear();
            alert("모든 설정이 초기화되었습니다.");
            location.reload();
        }

        function initSupabase(url, key) {
            try {
                supabaseClient = supabase.createClient(url, key);
                document.getElementById('db-status-badge').className = "inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                document.getElementById('db-status-text').innerText = "Supabase 연동";
                fetchTopicsAndSentences();
            } catch (e) {}
        }

        // 메인(topics)과 서브(script_sentences) 테이블 관계형 조회
        async function fetchTopicsAndSentences() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('topics')
                    .select(`
                        id,
                        title,
                        description,
                        created_at,
                        script_sentences (
                            id,
                            sentence_order,
                            en,
                            ko,
                            expressions,
                            patterns
                        )
                    `)
                    .order('created_at', { ascending: true });

                if (!error && data && data.length > 0) {
                    // 각 주제 내부의 문장들을 sentence_order 순으로 정렬
                    topicsData = data.map(topic => {
                        const sortedSentences = (topic.script_sentences || []).sort((a, b) => a.sentence_order - b.sentence_order);
                        return {
                            id: topic.id,
                            title: topic.title,
                            description: topic.description,
                            sentences: sortedSentences.length > 0 ? sortedSentences : [{
                                id: 'empty',
                                sentence_order: 1,
                                en: '등록된 세부 문장이 없습니다.',
                                ko: '문장을 추가해 주세요.',
                                expressions: [],
                                patterns: []
                            }]
                        };
                    });
                    currentTopicIdx = 0;
                    currentSubSentenceIdx = 0;
                    renderCurrentView();
                }
            } catch (err) {
                console.error("DB Fetch Error:", err);
            }
        }

        function toggleSpeed() {
            selectedSpeed = selectedSpeed === 1.0 ? 0.75 : 1.0;
            document.getElementById('speed-text').innerText = `${selectedSpeed}x`;
            if (currentAudioObject) currentAudioObject.playbackRate = selectedSpeed;
        }

        function toggleWritingMode() {
            isWritingMode = !isWritingMode;
            document.getElementById('writing-status').innerText = isWritingMode ? "ON" : "OFF";
            document.getElementById('writing-status').className = isWritingMode ? "text-indigo-600 font-bold" : "text-slate-500";
            renderCurrentView();
        }

        function revealWritingAnswer() {
            document.getElementById('writing-answer-box').classList.remove('hidden');
            document.getElementById('reveal-btn').classList.add('hidden');
        }

        // 텍스트 직접 재생 헬퍼 (핵심표현/변형패턴 클릭 시 사용)
        async function speakSpecificText(customText, loop = false) {
            if (!customText) return;
            const apiKey = localStorage.getItem('g_api_key');
            const voiceName = localStorage.getItem('g_voice_name') || 'en-US-Neural2-F';

            if (currentAudioObject) {
                currentAudioObject.pause();
                currentAudioObject = null;
            }

            const btnIcon = document.getElementById('tts-btn-icon');
            btnIcon.innerText = "⏳";

            if (apiKey) {
                const url = `https://texttospeech.googleapis.com/v1/text:synthesize?key=${apiKey}`;
                const requestBody = {
                    input: { text: customText },
                    voice: { languageCode: 'en-US', name: voiceName },
                    audioConfig: { audioEncoding: 'MP3', speakingRate: selectedSpeed }
                };

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });
                    const data = await response.json();
                    if (data.audioContent) {
                        const audio = new Audio("data:audio/mp3;base64," + data.audioContent);
                        audio.playbackRate = selectedSpeed;
                        audio.loop = loop;
                        currentAudioObject = audio;
                        audio.play();
                        audio.onended = () => { if (!audio.loop) btnIcon.innerText = "🔊"; };
                        btnIcon.innerText = "🔊";
                    } else { btnIcon.innerText = "🔊"; }
                } catch (e) { btnIcon.innerText = "🔊"; }
            } else {
                if (!('speechSynthesis' in window)) { btnIcon.innerText = "🔊"; return; }
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(customText);
                utterance.lang = 'en-US';
                utterance.rate = selectedSpeed;
                utterance.onend = () => { btnIcon.innerText = "🔊"; };
                window.speechSynthesis.speak(utterance);
                btnIcon.innerText = "🔊";
            }
        }

        // 현재 단계에 맞는 음성 재생 (Step 1, 3: 주제 전체 문장 / Step 2: 현재 보고 있는 1개 문장)
        function speakCurrentContent() {
            const topic = topicsData[currentTopicIdx] || topicsData[0];
            if (!topic || !topic.sentences || topic.sentences.length === 0) return;

            if (currentStepIdx === 1) {
                // Step 2: 현재 선택된 서브 문장 1개만 재생
                const sub = topic.sentences[currentSubSentenceIdx] || topic.sentences[0];
                speakSpecificText(sub.en, false);
            } else {
                // Step 1 & Step 3: 주제의 전체 문장 합쳐서 재생 (Step 3는 무한 반복)
                const fullScript = topic.sentences.map(s => s.en).join(' ');
                const isLoop = (currentStepIdx === 2);
                speakSpecificText(fullScript, isLoop);
            }
        }

        function renderCurrentView() {
            if (!topicsData || topicsData.length === 0) return;
            if (currentAudioObject) {
                currentAudioObject.pause();
                currentAudioObject = null;
                document.getElementById('tts-btn-icon').innerText = "🔊";
            }

            const topic = topicsData[currentTopicIdx] || topicsData[0];
            const subSentences = topic.sentences || [];
            const activeSub = subSentences[currentSubSentenceIdx] || subSentences[0];
            const st = steps[currentStepIdx] || steps[0];

            // 헤더 및 진행 상태 표시
            document.getElementById('current-topic-title').innerText = topic.title || `주제 ${currentTopicIdx + 1}`;
            if (currentStepIdx === 1) {
                document.getElementById('sentence-counter').innerText = `주제 ${currentTopicIdx + 1}/${topicsData.length} · 문장 ${currentSubSentenceIdx + 1}/${subSentences.length}`;
            } else {
                document.getElementById('sentence-counter').innerText = `주제 ${currentTopicIdx + 1} / ${topicsData.length} (총 ${subSentences.length}문장)`;
            }

            document.getElementById('step-badge').innerText = `Step ${st.step}`;
            document.getElementById('step-title').innerText = st.title;
            document.getElementById('step-desc').innerText = st.desc;

            const contentDisplay = document.getElementById('content-display');
            const writingDisplay = document.getElementById('writing-display');
            const koBox = document.getElementById('ko-box');

            // 현재 기준 영어/한글 텍스트 산출
            const targetEn = (currentStepIdx === 1) ? activeSub.en : subSentences.map(s => s.en).join(' ');
            const targetKo = (currentStepIdx === 1) ? activeSub.ko : subSentences.map(s => s.ko).join(' ');

            if (isWritingMode) {
                contentDisplay.classList.add('hidden');
                writingDisplay.classList.remove('hidden');
                koBox.classList.add('hidden');
                document.getElementById('writing-ko-prompt').innerText = targetKo || "";
                document.getElementById('writing-answer-box').innerText = targetEn || "";
                document.getElementById('writing-answer-box').classList.add('hidden');
                document.getElementById('reveal-btn').classList.remove('hidden');
            } else {
                writingDisplay.classList.add('hidden');
                contentDisplay.classList.remove('hidden');
                koBox.classList.remove('hidden');

                if (currentStepIdx === 0) {
                    contentDisplay.innerHTML = `<span class="text-slate-400 text-base font-normal">🎧 화면을 보지 말고 전체 스크립트를 귀로만 들어보세요</span>`;
                } else if (currentStepIdx === 1) {
                    // Step 2: 한 문장씩 대형 폰트로 표시
                    contentDisplay.innerHTML = `
                        <div class="text-indigo-600 text-xs font-bold mb-1.5">문장 ${currentSubSentenceIdx + 1} / ${subSentences.length}</div>
                        <div>${activeSub.en}</div>
                    `;
                } else {
                    // Step 3: 전체 스크립트 섀도잉 뷰
                    contentDisplay.innerText = targetEn;
                }
            }

            document.getElementById('ko-display').innerText = targetKo || "";

            // 핵심 표현 렌더링 (터치 시 원어민 발음 재생)
            const exprContainer = document.getElementById('expressions-container');
            const exprChips = document.getElementById('expression-chips');
            exprChips.innerHTML = '';
            const currentExprs = (currentStepIdx === 1) 
                ? (activeSub.expressions || []) 
                : subSentences.flatMap(s => s.expressions || []);

            if (currentExprs.length > 0) {
                exprContainer.classList.remove('hidden');
                currentExprs.forEach(ex => {
                    const chip = document.createElement('button');
                    chip.className = "bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-[11px] font-semibold px-2.5 py-1 rounded-md border border-indigo-200 transition flex items-center gap-1";
                    chip.innerHTML = `<span>🔊</span><span>${ex}</span>`;
                    chip.onclick = () => speakSpecificText(ex, false);
                    exprChips.appendChild(chip);
                });
            } else { exprContainer.classList.add('hidden'); }

            // 변형 패턴 렌더링 (터치 시 원어민 발음 재생)
            const patternsContainer = document.getElementById('patterns-container');
            const patternList = document.getElementById('pattern-list');
            patternList.innerHTML = '';
            const currentPatterns = (currentStepIdx === 1) 
                ? (activeSub.patterns || []) 
                : subSentences.flatMap(s => s.patterns || []);

            if (currentPatterns.length > 0) {
                patternsContainer.classList.remove('hidden');
                currentPatterns.forEach(p => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left text-[11px] text-slate-700 hover:text-indigo-700 font-medium bg-white hover:bg-indigo-50/50 p-2 rounded-lg border border-slate-200 transition flex items-center justify-between";
                    btn.innerHTML = `<span>• ${p}</span><span class="text-[10px] text-indigo-500 ml-2 shrink-0">🔊 듣기</span>`;
                    btn.onclick = () => speakSpecificText(p, false);
                    patternList.appendChild(btn);
                });
            } else { patternsContainer.classList.add('hidden'); }

            // 하단 메인 버튼 텍스트 안내
            if (currentStepIdx === 1 && currentSubSentenceIdx < subSentences.length - 1) {
                document.getElementById('next-btn-text').innerText = `다음 문장 (${currentSubSentenceIdx + 2}/${subSentences.length}) ➔`;
            } else if (currentStepIdx < 2) {
                document.getElementById('next-btn-text').innerText = `Step ${st.step + 1}로 ➔`;
            } else {
                document.getElementById('next-btn-text').innerText = "학습 완료 (다음 주제)";
            }
        }

        // 단계 및 문장 순차 이동 로직
        function changeStep(direction) {
            const topic = topicsData[currentTopicIdx] || topicsData[0];
            const subSentences = topic.sentences || [];

            if (currentStepIdx === 1) {
                if (direction > 0 && currentSubSentenceIdx < subSentences.length - 1) {
                    // Step 2에서 다음 문장이 남아있다면 다음 서브 문장으로 이동 + 자동 재생
                    currentSubSentenceIdx++;
                    renderCurrentView();
                    speakCurrentContent();
                    return;
                } else if (direction < 0 && currentSubSentenceIdx > 0) {
                    // Step 2에서 이전 문장으로 이동
                    currentSubSentenceIdx--;
                    renderCurrentView();
                    speakCurrentContent();
                    return;
                }
            }

            currentStepIdx += direction;

            if (currentStepIdx > 2) {
                // Step 3 완료 -> 통계 기록 후 다음 주제로 이동
                recordTopicCompletion(topic.id);
                currentStepIdx = 0;
                currentSubSentenceIdx = 0;
                nextTopic();
                return;
            }

            if (currentStepIdx < 0) {
                currentStepIdx = 2;
            }

            if (currentStepIdx === 1) {
                currentSubSentenceIdx = direction > 0 ? 0 : Math.max(0, subSentences.length - 1);
            }

            renderCurrentView();
        }

        function nextTopic() {
            currentTopicIdx = (currentTopicIdx + 1) % topicsData.length;
            currentStepIdx = 0;
            currentSubSentenceIdx = 0;
            renderCurrentView();
        }

        function recordTopicCompletion(topicId) {
            try {
                let stats = JSON.parse(localStorage.getItem('topic_stats') || '{}');
                stats[topicId] = (stats[topicId] || 0) + 1;
                localStorage.setItem('topic_stats', JSON.stringify(stats));
            } catch (e) {}
        }

        // 주제 선택 모달
        function openTopicModal() {
            const container = document.getElementById('topic-list-container');
            container.innerHTML = '';
            topicsData.forEach((t, idx) => {
                const btn = document.createElement('button');
                const count = t.sentences ? t.sentences.length : 0;
                btn.className = `w-full text-left p-3.5 rounded-xl border text-xs font-semibold flex justify-between items-center transition ${idx === currentTopicIdx ? 'bg-indigo-50 border-indigo-300 text-indigo-900' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}`;
                btn.innerHTML = `
                    <div>
                        <div class="font-bold text-sm">${idx + 1}. ${t.title}</div>
                        <div class="text-[11px] text-slate-500 mt-0.5">총 ${count}개 문장 구성</div>
                    </div>
                    <span class="text-xs text-indigo-600 font-bold shrink-0">학습 ➔</span>
                `;
                btn.onclick = () => {
                    currentTopicIdx = idx;
                    currentStepIdx = 0;
                    currentSubSentenceIdx = 0;
                    renderCurrentView();
                    closeTopicModal();
                };
                container.appendChild(btn);
            });
            document.getElementById('topic-modal').classList.remove('hidden');
            document.getElementById('topic-modal').classList.add('flex');
        }
        function closeTopicModal() { document.getElementById('topic-modal').classList.remove('flex'); document.getElementById('topic-modal').classList.add('hidden'); }

        // 통계 모달 (주제 기준)
        function openStatsModal() {
            const stats = JSON.parse(localStorage.getItem('topic_stats') || '{}');
            const container = document.getElementById('stats-list-container');
            container.innerHTML = '';
            topicsData.forEach((t, idx) => {
                const count = stats[t.id] || 0;
                const div = document.createElement('div');
                div.className = "bg-slate-50 p-3.5 rounded-xl border border-slate-200 flex justify-between items-center";
                div.innerHTML = `
                    <div>
                        <div class="text-xs font-bold text-slate-800">${idx + 1}. ${t.title}</div>
                        <div class="text-[10px] text-slate-500 mt-0.5">${t.description || `총 ${t.sentences.length}문장`}</div>
                    </div>
                    <div class="bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-bold shrink-0">${count}회 완료</div>
                `;
                container.appendChild(div);
            });
            document.getElementById('stats-modal').classList.remove('hidden');
            document.getElementById('stats-modal').classList.add('flex');
        }
        function closeStatsModal() { document.getElementById('stats-modal').classList.remove('flex'); document.getElementById('stats-modal').classList.add('hidden'); }

        function openConfigModal() { document.getElementById('config-modal').classList.remove('hidden'); document.getElementById('config-modal').classList.add('flex'); }
        function closeConfigModal() { document.getElementById('config-modal').classList.remove('flex'); document.getElementById('config-modal').classList.add('hidden'); }
        
        function openAddModal() { 
            resetAddModalInputs();
            document.getElementById('add-modal').classList.remove('hidden'); 
            document.getElementById('add-modal').classList.add('flex'); 
        }
        function closeAddModal() { document.getElementById('add-modal').classList.remove('flex'); document.getElementById('add-modal').classList.add('hidden'); }

        // 새 주제 및 다중 문장 입력 UI 관리
        function resetAddModalInputs() {
            document.getElementById('new-topic-title').value = '';
            document.getElementById('new-topic-desc').value = '';
            const container = document.getElementById('sentence-inputs-container');
            container.innerHTML = '';
            appendSentenceInputRow();
            appendSentenceInputRow();
        }

        function appendSentenceInputRow() {
            const container = document.getElementById('sentence-inputs-container');
            const idx = container.children.length + 1;
            const div = document.createElement('div');
            div.className = "sentence-input-group bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2 relative";
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-[11px] font-bold text-slate-600">문장 #${idx}</span>
                    ${idx > 1 ? `<button type="button" onclick="this.parentElement.parentElement.remove()" class="text-[10px] text-rose-500 font-semibold">삭제</button>` : ''}
                </div>
                <input type="text" class="sub-en w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs" placeholder="영어 한 문장 (필수)">
                <input type="text" class="sub-ko w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs" placeholder="한국어 해석 (필수)">
                <input type="text" class="sub-expr w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs" placeholder="핵심 표현 (쉼표로 구분, 선택)">
                <input type="text" class="sub-pat w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs" placeholder="변형 패턴 문장 (/ 로 구분, 선택)">
            `;
            container.appendChild(div);
        }

        async function saveNewTopicAndSentences() {
            const title = document.getElementById('new-topic-title').value.trim();
            const description = document.getElementById('new-topic-desc').value.trim();
            if (!title) {
                alert("메인 주제 제목을 입력해 주세요.");
                return;
            }

            const groups = document.querySelectorAll('.sentence-input-group');
            const parsedSentences = [];

            groups.forEach((group, i) => {
                const en = group.querySelector('.sub-en').value.trim();
                const ko = group.querySelector('.sub-ko').value.trim();
                const exprRaw = group.querySelector('.sub-expr').value.trim();
                const patRaw = group.querySelector('.sub-pat').value.trim();

                if (en && ko) {
                    parsedSentences.push({
                        sentence_order: i + 1,
                        en,
                        ko,
                        expressions: exprRaw ? exprRaw.split(',').map(s => s.trim()).filter(Boolean) : [],
                        patterns: patRaw ? patRaw.split('/').map(s => s.trim()).filter(Boolean) : []
                    });
                }
            });

            if (parsedSentences.length === 0) {
                alert("최소 1개 이상의 영어 문장과 한국어 해석을 입력해 주세요.");
                return;
            }

            if (supabaseClient) {
                try {
                    // 1. 메인 topics 테이블에 저장
                    const { data: topicRes, error: topicErr } = await supabaseClient
                        .from('topics')
                        .insert([{ title, description }])
                        .select()
                        .single();

                    if (topicErr) throw topicErr;

                    // 2. 서브 script_sentences 테이블에 topic_id 연결하여 일괄 저장
                    const rowsToInsert = parsedSentences.map(s => ({
                        topic_id: topicRes.id,
                        sentence_order: s.sentence_order,
                        en: s.en,
                        ko: s.ko,
                        expressions: s.expressions,
                        patterns: s.patterns
                    }));

                    const { error: subErr } = await supabaseClient
                        .from('script_sentences')
                        .insert(rowsToInsert);

                    if (subErr) throw subErr;

                    await fetchTopicsAndSentences();
                    currentTopicIdx = topicsData.length - 1;
                } catch (err) {
                    console.error("Save Error:", err);
                    alert("DB 저장 중 오류가 발생했습니다. 로컬에만 임시 반영됩니다.");
                    topicsData.push({
                        id: 'local-' + Date.now(),
                        title,
                        description,
                        sentences: parsedSentences
                    });
                    currentTopicIdx = topicsData.length - 1;
                }
            } else {
                topicsData.push({
                    id: 'local-' + Date.now(),
                    title,
                    description,
                    sentences: parsedSentences
                });
                currentTopicIdx = topicsData.length - 1;
            }

            currentStepIdx = 0;
            currentSubSentenceIdx = 0;
            renderCurrentView();
            closeAddModal();
        }
    </script>
</body>
</html>
