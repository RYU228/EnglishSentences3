name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 또는 master (기본 브랜치 이름)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Secrets 값을 index.html에 치환해 주는 단계
      - name: Replace Secrets in index.html
        run: |
          sed -i 's|YOUR_SUPABASE_URL|${{ secrets.SUPABASE_URL }}|g' index.html
          sed -i 's|YOUR_SUPABASE_ANON_KEY|${{ secrets.SUPABASE_ANON_KEY }}|g' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
